name: Validate control plane

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-validation:
    name: control-plane-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Python version
        run: python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
      - name: Validate control-plane structure
        run: python3 tools/validate_control_plane.py
      - name: Validate skills
        run: python3 tools/validate_skills.py
      - name: Run security validator self-test
        run: python3 tools/validate_security.py --self-test
      - name: Scan repository for sensitive content
        run: python3 tools/validate_security.py .
      - name: Run Git hook regression tests
        run: python3 tools/test_git_hooks.py
      - name: Test unattended OpenCode guard
        run: python3 tools/test_opencode_guard.py
      - name: Test Workflow v3 development CLI
        run: python3 tools/test_dev_cli.py
      - name: Test Qortium Dev Monitor P1
        run: |
          python3 tools/test_dev_monitor_redact.py
          python3 tools/test_dev_monitor_auth.py
          python3 tools/test_dev_monitor_projects.py
          python3 tools/test_dev_monitor_documents.py
          python3 tools/test_dev_monitor_jobs.py
          python3 tools/test_dev_monitor_api.py
          python3 tools/test_dev_monitor_state.py
          python3 tools/test_dev_monitor_timings.py
          python3 tools/test_dev_monitor_service_unit.py
          python3 tools/test_dev_monitor_integration.py
      - name: Scan reachable Git history
        run: |
          zero=0000000000000000000000000000000000000000
          printf 'refs/heads/main %s refs/heads/main %s\n' "$GITHUB_SHA" "$zero" \
            | python3 tools/git_hooks.py pre-push --repo .
